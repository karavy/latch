---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - update
- apiGroups:
  - apps
  resources:
  - controllerrevisions
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - dinova.one
  resources:
  - apicalls
  - baseclusters
  - workflowinstances
  - workflows
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dinova.one
  resources:
  - apicalls/finalizers
  - baseclusters/finalizers
  - workflowinstances/finalizers
  - workflowpipelines/finalizers
  - workflows/finalizers
  verbs:
  - update
- apiGroups:
  - dinova.one
  resources:
  - apicalls/status
  - baseclusters/status
  - terraformtemplates/status
  - workflowinstances/status
  - workflowpipelines/status
  - workflows/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - dinova.one
  resources:
  - apicalltemplates
  - terraformtemplates
  - workflowtemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dinova.one
  resources:
  - workflowpipelines
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
