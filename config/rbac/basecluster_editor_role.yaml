# This rule is not used by the project latch itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dinova.one.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: latch
    app.kubernetes.io/managed-by: kustomize
  name: basecluster-editor-role
rules:
- apiGroups:
  - dinova.one
  resources:
  - baseclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dinova.one
  resources:
  - baseclusters/status
  verbs:
  - get
