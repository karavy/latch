# The Terraform files live in an immutable ConfigMap: the operator refuses any other. To change
# them, create the ConfigMap again (or a new one, and point the template to it); the operator
# then makes a new revision of the template (status.revision), and the next Workflow runs it.
# While debugging, spec.allowMutableSources (honoured only by an operator started with
# --allow-mutable-terraform-sources) accepts a ConfigMap without immutable: true, edited in
# place with kubectl edit: every edit still makes a new revision.
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: latch
    app.kubernetes.io/managed-by: kustomize
  name: terraformtemplate-sample-files
immutable: true
data:
  variables.tf: |
    variable "vdc_id" {
      type = string
    }
  main.tf.tmpl: |
    resource "terraform_data" "vdc" {
      input = "<FGT_VDC_ID>"
    }

    # Outputs can be published by the step (terraform.outputs); the backend is added by the
    # runner, so the template does not declare one.
    output "network_id" {
      value = terraform_data.vdc.id
    }
---
apiVersion: dinova.one/v1alpha1
kind: TerraformTemplate
metadata:
  labels:
    app.kubernetes.io/name: latch
    app.kubernetes.io/managed-by: kustomize
  name: terraformtemplate-sample
spec:
  # A step runs the current revision of these files. *.tf.tmpl files are rendered by
  # terraform-engine: <FGT_NAME> is replaced by the step input whose target is /name (keys are
  # upper-cased, so /vdc_id becomes <FGT_VDC_ID>). The same inputs are also written to
  # terraform.auto.tfvars.json, so var.vdc_id works in plain .tf files.
  files:
    - name: variables.tf
      configMapKeyRef: {name: terraformtemplate-sample-files, key: variables.tf}
    - name: main.tf.tmpl
      configMapKeyRef: {name: terraformtemplate-sample-files, key: main.tf.tmpl}
