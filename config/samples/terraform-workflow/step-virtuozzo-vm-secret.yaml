# The values of the variables of the ConfigMap step-virtuozzo-vm. The step exposes the keys of a
# Secret as environment variables (envFromSecrets), and Terraform reads the variables named
# TF_VAR_<name>, so each key here is the TF_VAR_ prefix plus the name of a variable of
# variables.tf. List the Secret in envFromSecrets of the Terraform step, next to
# tfstate-credentials.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: latch
    app.kubernetes.io/component: terraform-workflow
  name: virtuozzo-credentials
type: Opaque
stringData:
  TF_VAR_os_username: admin
  TF_VAR_os_tenant_name: admin
  TF_VAR_os_password: "Password01!"
  TF_VAR_os_auth_url: https://192.168.20.176:5000/v3
  TF_VAR_os_region: RegionOne
  TF_VAR_os_domain_name: virtuozzo
  TF_VAR_image_name: ubuntu-2604-kube-v1.36.1
  TF_VAR_flavor_name: medium
  TF_VAR_network_name: private
  TF_VAR_external_network: public
  TF_VAR_keypair_name: capi-key
  TF_VAR_secgroup_name: default
  TF_VAR_volume_type: default
  TF_VAR_volume_size_gb: "20"
