---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: workflowpipelines.dinova.one
spec:
  group: dinova.one
  names:
    kind: WorkflowPipeline
    listKind: WorkflowPipelineList
    plural: workflowpipelines
    singular: workflowpipeline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkflowPipeline runs a process made of WorkflowInstances and Workflows, in the order of
          their dependencies, passing outputs from one stage to the next.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WorkflowPipeline
            properties:
              parameters:
                description: |-
                  Parameters are given to every stage whose WorkflowTemplate declares a parameter of that
                  name, for example the client name. A stage's own parameters take precedence.
                items:
                  description: WorkflowParameter is a named string value.
                  properties:
                    name:
                      maxLength: 63
                      pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
                      type: string
                    value:
                      maxLength: 1024
                      type: string
                  required:
                  - name
                  - value
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              rerun:
                description: |-
                  Rerun lists Workflows of Workflow stages to run again (status.stages[].workflow): a stage
                  whose run failed, or that is Outdated because a value it used changed. The stage starts a
                  new run with the current values. An entry that is not the current run of a stage is
                  ignored, so a stage runs again only once for each entry.
                items:
                  maxLength: 253
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: set
              stages:
                description: |-
                  Stages are the steps of the process. A stage starts once all the stages it depends on
                  are ready; stages that do not depend on each other run at the same time.
                items:
                  description: 'WorkflowPipelineStage is one stage of a pipeline:
                    a WorkflowInstance or a Workflow.'
                  properties:
                    dependsOn:
                      description: |-
                        DependsOn names the stages that must be ready before this one starts: a WorkflowInstance
                        whose Ready condition is True, or a Workflow that succeeded. A stage that reads the
                        outputs of another (valueFrom) must depend on it, directly or through other stages.
                      items:
                        maxLength: 40
                        type: string
                      maxItems: 20
                      type: array
                      x-kubernetes-list-type: set
                    instance:
                      description: |-
                        Instance makes the stage a WorkflowInstance: Terraform steps only, applied again when
                        their code or values change and every interval. When an output it reads changes, its
                        revision changes, and it runs again by itself.
                      properties:
                        acceptStateHolds:
                          items:
                            maxLength: 128
                            type: string
                          maxItems: 16
                          type: array
                          x-kubernetes-list-type: set
                        approval:
                          default: Auto
                          enum:
                          - Auto
                          - Manual
                          type: string
                        approvePlan:
                          maxLength: 253
                          type: string
                        deletionPolicy:
                          default: Retain
                          enum:
                          - Retain
                          - Destroy
                          type: string
                        interval:
                          format: duration
                          type: string
                        retryInterval:
                          format: duration
                          type: string
                        suspend:
                          type: boolean
                        templateRef:
                          description: WorkflowResourceReference names an object in
                            the Workflow's namespace.
                          properties:
                            name:
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        workspaceStorage:
                          default: 2Gi
                          pattern: ^[1-9][0-9]*(Mi|Gi|Ti)$
                          type: string
                      required:
                      - interval
                      - templateRef
                      type: object
                    name:
                      description: Name identifies the stage, and names its objects
                        "<pipeline>-<name>".
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    parameters:
                      description: |-
                        Parameters give a value to the parameters the stage's WorkflowTemplate declares: a fixed
                        value, or an output of an earlier stage.
                      items:
                        description: WorkflowPipelineParameter gives a value to a
                          parameter of a stage's WorkflowTemplate.
                        properties:
                          name:
                            maxLength: 63
                            pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
                            type: string
                          value:
                            description: Value is a fixed value.
                            maxLength: 1024
                            type: string
                          valueFrom:
                            description: ValueFrom reads an output of an earlier stage.
                            properties:
                              output:
                                maxLength: 63
                                pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
                                type: string
                              stage:
                                description: |-
                                  Stage is the stage that publishes the output. The stage that reads it must depend on it.
                                  For a Workflow stage the output is read from its current run, once it succeeded; for a
                                  WorkflowInstance stage, from its newest run that succeeded and published it.
                                maxLength: 40
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                              step:
                                description: Step is the step of the stage's WorkflowTemplate,
                                  and Output the output it publishes.
                                maxLength: 40
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                            required:
                            - output
                            - stage
                            - step
                            type: object
                        required:
                        - name
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one of value or valueFrom must be set
                          rule: has(self.value) != has(self.valueFrom)
                      maxItems: 32
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    workflow:
                      description: |-
                        Workflow makes the stage a Workflow that runs once: API and Terraform steps. When a
                        value it used changes, it does not run again by itself: it becomes Outdated, unless
                        rerunOnChange says otherwise.
                      properties:
                        acceptStateHolds:
                          description: AcceptStateHolds is passed to the runs (see
                            the Workflow's acceptStateHolds).
                          items:
                            maxLength: 128
                            type: string
                          maxItems: 16
                          type: array
                          x-kubernetes-list-type: set
                        rerunOnChange:
                          description: |-
                            RerunOnChange runs the stage again, as a new Workflow, when a value it used changes,
                            instead of marking it Outdated. It is refused unless every API step of the template is
                            safe to repeat: a GET, or a step marked idempotent.
                          type: boolean
                        templateRef:
                          description: WorkflowResourceReference names an object in
                            the Workflow's namespace.
                          properties:
                            name:
                              maxLength: 253
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        workspaceStorage:
                          default: 2Gi
                          pattern: ^[1-9][0-9]*(Mi|Gi|Ti)$
                          type: string
                      required:
                      - templateRef
                      type: object
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of instance or workflow must be set
                    rule: has(self.instance) != has(self.workflow)
                maxItems: 20
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - stages
            type: object
            x-kubernetes-validations:
            - message: dependsOn must name other stages of the pipeline
              rule: self.stages.all(s, !has(s.dependsOn) || s.dependsOn.all(d, d !=
                s.name && self.stages.exists(t, t.name == d)))
          status:
            description: status defines the observed state of WorkflowPipeline
            properties:
              conditions:
                description: |-
                  Conditions has Ready: True when every stage is Ready, False with the first stage that is
                  not, otherwise.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              stages:
                description: Stages has one entry per stage, in the order of the spec.
                items:
                  description: WorkflowPipelineStageStatus is where one stage is.
                  properties:
                    changed:
                      description: Changed lists the values that changed since the
                        current run of an Outdated stage.
                      items:
                        description: WorkflowPipelineChangedParameter is a value a
                          Workflow stage used that changed since.
                        properties:
                          name:
                            type: string
                          new:
                            type: string
                          old:
                            description: Old is the value of the current run, New
                              the value a new run would get.
                            type: string
                        required:
                        - name
                        - new
                        - old
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    instance:
                      description: Instance is the WorkflowInstance of an instance
                        stage.
                      type: string
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      description: |-
                        Phase is Pending (waiting for the stages it depends on, or for an output), Running,
                        Ready (the instance is Ready, or the Workflow succeeded), Outdated (the Workflow
                        succeeded, but a value it used changed since), Failed, or Deleting.
                      enum:
                      - Pending
                      - Running
                      - Ready
                      - Outdated
                      - Failed
                      - Deleting
                      type: string
                    runs:
                      format: int64
                      type: integer
                    workflow:
                      description: Workflow is the current run of a Workflow stage,
                        and Runs how many it started.
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'the pipeline name and each stage name are at most 55 characters
            together: they name the stage objects, which are used in labels'
          rule: self.spec.stages.all(s, size(self.metadata.name) + size(s.name) <=
            55)
    served: true
    storage: true
    subresources:
      status: {}
